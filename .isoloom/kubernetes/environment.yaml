      hostname: web
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      - name: wait-db
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z db 5432; do sleep 2; done
      - name: wait-mongo
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z mongo 27017; do sleep 2; done
      - name: wait-imds
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z imds 8090; do sleep 2; done
      - name: wait-vault
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z vault 8091; do sleep 2; done
      containers:
      - name: web
        image: isoloom/vulnerable-node-web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3000
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: isoloom-probe
        emptyDir: {}
