# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: vulnerable-node
services:
  db:
    build:
      context: ../../build/db
      labels:
        isoloom.managed: 'true'
        isoloom.environment: vulnerable-node
    image: isoloom/vulnerable-node-db
    platform: linux/amd64
    hostname: db
    networks:
      lab:
        ipv4_address: 10.60.15.20
    volumes:
    - db-pgdata:/var/lib/postgresql/data
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 5432
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.postgres: tcp:5432
      isoloom.managed: 'true'
      isoloom.environment: vulnerable-node
    restart: unless-stopped
  db-routes:
    image: alpine:3.20
    network_mode: service:db
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulnerable-node
  mongo:
    image: mongo:7.0
    platform: linux/amd64
    hostname: mongo
    networks:
      lab:
        ipv4_address: 10.60.15.21
    volumes:
    - mongo-mongodata:/data/db
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
