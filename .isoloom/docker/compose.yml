      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulnerable-node
  imds:
